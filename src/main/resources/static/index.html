<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisasterConnect — Crisis Response & Relief Platform</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%200%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="#alerts" class="brand">
                <span class="brand-icon">🛡️</span>
                <span>DisasterConnect</span>
            </a>

            <nav>
                <ul class="nav-links" id="nav-links">
                    <!-- Populated dynamically based on user role in app.js -->
                </ul>
            </nav>

            <div class="nav-auth" id="nav-auth-container">
                <button class="notif-bell" id="nav-notif-bell" title="Notifications" aria-label="Notifications">
                    <span>🔔</span>
                    <span class="notif-badge" id="nav-notif-badge" style="display:none;">0</span>
                </button>
                <div id="nav-auth" style="display:flex; align-items:center; gap:0.5rem;">
                    <!-- Populated dynamically with user badge or sign in/register buttons -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main class="main-wrapper" id="app-content">
        <div style="text-align: center; padding: 4rem 1rem;">
            <div class="loader"></div>
            <p style="color: var(--text-muted); margin-top: 1rem;">Connecting to DisasterConnect operational network...</p>
        </div>
    </main>

    <!-- Global Toast Notifications Container -->
    <div id="toast-container"></div>

    <!-- Application Footer -->
    <footer>
        <div style="max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
                <strong>DisasterConnect Platform</strong> &copy; 2026. Empowering frontline responders, humanitarian organizations, and citizens.
            </div>
            <div style="display: flex; gap: 1.5rem; font-size: 0.85rem;">
                <span>Emergency Hotline: <strong>112 / 108</strong></span>
                <span>System Status: <strong style="color: var(--success);">ONLINE</strong></span>
            </div>
        </div>
    </footer>

    <!-- Modular Script Entry Point -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
