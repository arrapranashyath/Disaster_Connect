# ==============================================================================
# DisasterConnect - Spring Boot Application Configuration
# Phase 2: Authentication, Authorization & User Management
# ==============================================================================

# Application Name & Server Port
spring.application.name=DisasterConnect
server.port=${SERVER_PORT:8080}

# Optional local properties file (git-ignored for development convenience)
spring.config.import=optional:classpath:application-local.properties

# ==============================================================================
# MySQL Database Configuration
# Sensitive credentials are read from environment variables to prevent exposing secrets.
# ==============================================================================
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/disaster_connect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ==============================================================================
# Spring Data JPA & Hibernate Configuration
# Using 'validate' protects the database against accidental alterations while
# verifying that the existing MySQL schema matches JPA entity definitions.
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# JWT Authentication Configuration
# In deployments, supply JWT_SECRET via environment variables.
# Startup validation enforces that the secret is at least 32 characters (256 bits).
# ==============================================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging configuration
logging.level.com.disasterconnect=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
