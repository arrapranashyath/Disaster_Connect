# ==============================================================================
# DisasterConnect - Test Suite Configuration
# Provides hermetic settings for JUnit testing
# ==============================================================================

spring.application.name=DisasterConnect-Test
server.port=0

# Use existing DB connection credentials from environment (or default user)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/disaster_connect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Non-production JWT secret specifically for automated test execution
app.jwt.secret=DisasterConnectTestSecretKeySpecificallyForHermeticTesting2026AtLeast32Bytes!
app.jwt.expiration-ms=86400000
